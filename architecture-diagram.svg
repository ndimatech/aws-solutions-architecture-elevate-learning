<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#444441"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#BA7517"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#3B6D11"/>
    </marker>
    <style>
      .t{font-size:16px;font-weight:600}
      .s{font-size:13px}
      .h{font-size:14px;font-weight:600;fill:#444441}
      .arr{stroke:#444441;stroke-width:1.6;fill:none}
      .mon{stroke:#BA7517;stroke-width:1.4;stroke-dasharray:6 4;fill:none}
      .bak{stroke:#3B6D11;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1200" height="1120" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#2C2C2A">Elevate Learning – Proposed Architecture</text>

  <g transform="translate(0,50)">
    <!-- Users -->
    <rect x="270" y="10" width="600" height="130" rx="14" fill="#F7F6F2" stroke="#888780" stroke-dasharray="6 4"/>
    <text class="h" x="290" y="34">Platform users</text>
    <g fill="#F1EFE8" stroke="#5F5E5A">
      <rect x="290" y="50" width="170" height="70" rx="8"/>
      <rect x="485" y="50" width="170" height="70" rx="8"/>
      <rect x="680" y="50" width="170" height="70" rx="8"/>
    </g>
    <g fill="#2C2C2A" text-anchor="middle">
      <text class="t" x="375" y="80">Learners</text><text class="s" x="375" y="102" fill="#5F5E5A">Courses &amp; assessments</text>
      <text class="t" x="570" y="80">Course staff</text><text class="s" x="570" y="102" fill="#5F5E5A">Publish, review results</text>
      <text class="t" x="765" y="80">IT team</text><text class="s" x="765" y="102" fill="#5F5E5A">Run &amp; support platform</text>
    </g>

    <line class="arr" x1="570" y1="140" x2="570" y2="188" marker-end="url(#a)"/>

    <!-- Entry & traffic -->
    <g fill="#E6F1FB" stroke="#185FA5">
      <rect x="420" y="190" width="300" height="70" rx="8"/>
      <rect x="420" y="300" width="300" height="70" rx="8"/>
      <rect x="420" y="410" width="300" height="70" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text class="t" x="570" y="220" fill="#0C447C">Content delivery network</text>
      <text class="s" x="570" y="242" fill="#185FA5">Serves pages &amp; media close to learners</text>
      <text class="t" x="570" y="330" fill="#0C447C">Web application firewall</text>
      <text class="s" x="570" y="352" fill="#185FA5">Secure HTTPS · blocks harmful traffic</text>
      <text class="t" x="570" y="440" fill="#0C447C">Load balancer</text>
      <text class="s" x="570" y="462" fill="#185FA5">Spreads traffic · health checks</text>
    </g>
    <line class="arr" x1="570" y1="260" x2="570" y2="298" marker-end="url(#a)"/>
    <line class="arr" x1="570" y1="370" x2="570" y2="408" marker-end="url(#a)"/>

    <!-- Private network -->
    <rect x="240" y="510" width="660" height="345" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="8 5"/>
    <text class="h" x="260" y="534">Private network</text>
    <text class="h" x="880" y="838" text-anchor="end">Encrypted data · MFA, role-based access</text>

    <line class="arr" x1="570" y1="480" x2="570" y2="548" marker-end="url(#a)"/>

    <!-- App tier -->
    <rect x="260" y="550" width="620" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-dasharray="5 4"/>
    <text x="570" y="574" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Auto-scaling application servers (add / remove with demand)</text>
    <g fill="#FFFFFF" stroke="#0F6E56">
      <rect x="290" y="592" width="260" height="76" rx="8"/>
      <rect x="590" y="592" width="260" height="76" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text class="t" x="420" y="624" fill="#085041">Servers – Zone A</text>
      <text class="s" x="420" y="646" fill="#0F6E56">Sign-in, courses, assessments</text>
      <text class="t" x="720" y="624" fill="#085041">Servers – Zone B</text>
      <text class="s" x="720" y="646" fill="#0F6E56">Sign-in, courses, assessments</text>
    </g>

    <!-- Data row -->
    <g fill="#EEEDFE" stroke="#534AB7">
      <rect x="260" y="740" width="170" height="70" rx="8"/>
      <rect x="460" y="740" width="220" height="70" rx="8"/>
      <rect x="710" y="740" width="170" height="70" rx="8"/>
      <rect x="20" y="595" width="190" height="70" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text class="t" x="345" y="770" fill="#3C3489">Session store</text>
      <text class="s" x="345" y="792" fill="#534AB7">Keeps users signed in</text>
      <text class="t" x="570" y="770" fill="#3C3489">Learner database</text>
      <text class="s" x="570" y="792" fill="#534AB7">Accounts, results, records</text>
      <text class="t" x="795" y="770" fill="#3C3489">Standby database</text>
      <text class="s" x="795" y="792" fill="#534AB7">Zone B · auto failover</text>
      <text class="t" x="115" y="625" fill="#3C3489">Media storage</text>
      <text class="s" x="115" y="647" fill="#534AB7">Videos, images, docs</text>
    </g>

    <line class="arr" x1="345" y1="690" x2="345" y2="738" marker-end="url(#a)"/>
    <line class="arr" x1="570" y1="690" x2="570" y2="738" marker-end="url(#a)"/>
    <line class="arr" x1="680" y1="775" x2="708" y2="775" marker-end="url(#a)"/>
    <line class="arr" x1="260" y1="630" x2="212" y2="630" marker-end="url(#a)"/>
    <path class="arr" d="M115 595 V225 H418" marker-end="url(#a)"/>
    <text class="s" x="125" y="215" fill="#5F5E5A">Content source for the CDN</text>

    <!-- Monitoring -->
    <rect x="940" y="410" width="240" height="110" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
    <g text-anchor="middle">
      <text class="t" x="1060" y="440" fill="#633806">Monitoring &amp; alerts</text>
      <text class="s" x="1060" y="464" fill="#854F0B">Dashboards, logs, alerts</text>
      <text class="s" x="1060" y="484" fill="#854F0B">Speed, errors, load, failures</text>
      <text class="s" x="1060" y="504" fill="#854F0B">IT team on call responds</text>
    </g>
    <path class="mon" d="M940 425 H915 V225 H722" marker-end="url(#m)"/>
    <path class="mon" d="M940 445 H722" marker-end="url(#m)"/>
    <path class="mon" d="M1000 520 V630 H882" marker-end="url(#m)"/>
    <path class="mon" d="M1080 520 V775 H882" marker-end="url(#m)"/>

    <!-- Backup -->
    <rect x="240" y="880" width="660" height="76" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
    <g text-anchor="middle">
      <text class="t" x="570" y="910" fill="#27500A">Backup &amp; recovery</text>
      <text class="s" x="570" y="932" fill="#3B6D11">Automated, tested backups · copy in a second region · server templates</text>
    </g>
    <line class="bak" x1="570" y1="810" x2="570" y2="878" marker-end="url(#b)"/>
    <path class="bak" d="M115 665 V918 H238" marker-end="url(#b)"/>

    <!-- Legend -->
    <g font-size="13" fill="#444441">
      <line class="arr" x1="240" y1="1000" x2="280" y2="1000"/>
      <text x="290" y="1005">Requests &amp; data</text>
      <line class="mon" x1="430" y1="1000" x2="470" y2="1000"/>
      <text x="480" y="1005">Monitoring</text>
      <line class="bak" x1="590" y1="1000" x2="630" y2="1000"/>
      <text x="640" y="1005">Backup</text>
      <rect x="720" y="992" width="30" height="16" rx="3" fill="none" stroke="#5F5E5A" stroke-dasharray="5 3"/>
      <text x="760" y="1005">Boundary / group</text>
    </g>
  </g>
</svg>
